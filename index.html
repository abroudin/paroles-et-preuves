bre 2026. Attention à ne pas confondre apprentis présents et nouveaux contrats annuels.","evidence":"https://www.education.gouv.fr/depp/l-apprentissage-au-31-decembre-2025-une-baisse-des-effectifs-de-28-par-rapport-2024-505299","evidenceLinks":["https://www.education.gouv.fr/depp/l-apprentissage-au-31-decembre-2025-une-baisse-des-effectifs-de-28-par-rapport-2024-505299","https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L16B1745-tIII-a47.html","https://dares.travail-emploi.gouv.fr/donnees/le-contrat-dapprentissage"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-eti","personId":"macron","claim":"La France est passée d'environ 5 400 entreprises de taille intermédiaire en 2017 à environ 7 500 aujourd'hui.","rawQuote":"","date":"2026-11-20","theme":"Économie","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"nuance","explanation":"L'INSEE recense 5 400 ETI en 2017 et près de 7 500 en 2023 (7 296 selon la série détaillée), dans les secteurs principalement marchands non agricoles et non financiers. La progression est documentée, mais le chiffre de 7 500 cité comme actuel en novembre 2026 correspond à une observation statistique antérieure. Il ne s'agit pas d'un décompte vérifié pour 2026.","evidence":"https://www.insee.fr/fr/statistiques/4255712","evidenceLinks":["https://www.insee.fr/fr/statistiques/4255712","https://www.insee.fr/fr/statistiques/8675639","https://www.insee.fr/fr/statistiques/2016091"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-usines","personId":"macron","claim":"Le solde cumulé des ouvertures et fermetures d'usines depuis 2017 serait de +300.","rawQuote":"« 300 ouvertures d'usines sur notre territoire en net »","date":"2026-11-20","theme":"Économie","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"indetermine","explanation":"Le baromètre industriel de la Direction générale des Entreprises relève un solde de +19 ouvertures et extensions en 2025, contre +88 en 2024. Il ne permet pas, isolément, d'attester le cumul de +300 depuis 2017 : périmètre (sites de plus de 20 salariés), définition d'extension et années étudiées doivent être harmonisés. Je ne sais pas confirmer le solde cumulé avancé sans reconstituer la série complète.","evidence":"https://www.entreprises.gouv.fr/espace-presse/barometre-industriel-de-letat-dossier-de-presse","evidenceLinks":["https://www.entreprises.gouv.fr/espace-presse/barometre-industriel-de-letat-dossier-de-presse"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-emplois","personId":"macron","claim":"Depuis mi-2017, 2,5 millions d'emplois auraient été créés, dont 1,8 million d'emplois salariés.","rawQuote":"","date":"2026-11-20","theme":"Emploi","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"attente","explanation":"Le discours donne ces deux chiffres, mais la présente sélection n'a pas rec function updateImagesInDom(){
  document.querySelectorAll('img[data-photo-id]').forEach(img=>{
    const p=PEOPLE.find(x=>x.id===img.dataset.photoId);
    if(!p||!p.photoResolved)return;
    if(img.getAttribute('src')!==p.photoResolved){
      img.hidden=false;
      const initials=img.nextElementSibling;
      if(initials)initials.hidden=true;
      img.src=p.photoResolved;
    }
  });
}
async function resolveWikipediaPortraits(){
  if(portraitsRequested)return;
  portraitsRequested=true;
  const candidates=PEOPLE.filter(p=>p.photo);
  const url=new URL('https://fr.wikipedia.org/w/api.php');
  url.searchParams.set('action','query');
  url.searchParams.set('format','json');
  url.searchParams.set('origin','*');
  url.searchParams.set('redirects','1');
  url.searchParams.set('prop','pageimages');
  url.searchParams.set('piprop','thumbnail|name');
  url.searchParams.set('pithumbsize','240');
  url.searchParams.set('titles',candidates.map(p=>portraitApiTitle(p)).join('|'));
  try{
    const response=await fetch(url.toString(),{mode:'cors',credentials:'omit'});
    if(!response.ok)throw new Error('API Wikimedia '+response.status);
    const payload=await response.json();
    const pages=Object.values(payload.query?.pages||{});
    const key=n=>String(n||'').normalize('NFKC').replaceAll('_',' ').trim().toLocaleLowerCase('fr');
    for(const p of candidates){
      const match=pages.find(page=>key(page.title)===key(p.name));
      if(!match?.thumbnail?.source||!match.pageimage)continue;
      p.photoResolved=match.thumbnail.source;
      p.photo=match.thumbnail.source;
      p.photoSource='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(match.pageimage);
    }
    updateImagesInDom();
  }catch(error){
    // Les URL Wikimedia Commons déjà connues restent actives; en cas d'échec, les initiales sont utilisées.
  }
}

function distributions(){const arr=['confirme','nuance','contredit','indetermine'];const verified=data.claims.filter(x=>x.status!=='attente');return `<div class="panel"><h3>Répartition des vérifications</h3><p class="subtle">Répartition des analyses documentaires initiales, non validées par une rédaction indépendante.</p><div class="dist-bar">${arr.map(s=>`<div class="dist-seg" style="width:${verified.length?Math.round(100*verified.filter(x=>x.status===s).length/verified.length):0}%;background:${STATUSES[s].color}"></div>`).join('')}</div><div class="dist-legend">${arr.map(s=>`<div class="dist-item"><span><span class="dot" style="background:${STATUSES[s].color}"></span>${STATUSES[s].label}</span><strong>${verified.filter(x=>x.status===s).length}</strong></div>`).join('')}</div><p class="subtle" style="margin:23px 0 0">${verified.length?'Sur '+verified.length+' vérification(s) publiée(s).':'Aucune analyse documentaire à ce stade.'}</p></div>`}
function notePanel(){return `<div class="panel"><h3>Principes éditoriaux</h3><p class="subtle" style="margin-top:6px">Les conclusions affichées sont préliminaires et n'ont pas fait l'objet d'une validation éditoriale humaine indépendante. Une déclaration n’est pas automatiquement vraie ou fausse.</p><div style="display:grid;gap:15px;margin-top:23px"><div><b style="font-size:12px">01. Citation d’origine</b><div class="subtle">Discours, entretien ou publication identifiable.</div></div><div><b style="font-size:12px">02. Documents contradictoires</b><div class="subtle">Sources datées et indépendantes, autant que possible.</div></div><div><b style="font-size:12px">03. Justification écrite</b><div class="subtle">Périmètre, période, limites et historique des corrections.</div></div></div><button class="textlink" data-nav="method" style="margin-top:15px">Consulter la méthode →</button></div>`}
function claimCard(c){const p=person(c.personId);return `<article class="claim-card" data-open="${h(c.id)}"><div class="claim-head"><div class="claim-byline">${portrait(p,'avatar-claim')}<div class="claim-byline-text"><strong>${h(p.name)}</strong><span>${dateFr(c.date)}</span></div></div>${statusChip(c.status)}</div><div class="claim-text">${h(c.claim)}</div><div class="claim-foot"><span class="chip theme">${h(c.theme||'Autre')}</span><span class="mini-meta">${h(c.context||'Contexte non renseigné')}</span></div></article>`}
function emptyClaims(text='Aucune affirmation ne correspond aux filtres.'){return `<div class="empty"><div class="empty-icon">⌕</div><strong>${h(text)}</strong><p>Aucune fiche sourcée n'est disponible pour ce filtre.</p></div>`}
function overview(){const c=counts();const recent=[...data.claims].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return header('Observation publique','Les faits, derrière les mots.','Un registre vérifiable des affirmations de responsables politiques. Chaque fiche présente ses sources, la méthode et ses limites.',`<button class="btn btn-primary" data-nav="claims">Explorer les affirmations →</button>`)+`<div class="stats">${stat('Affirmations recensées',c.total,'Base complète')}${stat('Vérifications documentées',c.checked,'Analyses préliminaires documentées')}${stat('À examiner',c.pending,'Aucun verdict publié')}${stat('Couverture du corpus',c.coverage+' %','Sur la base complète')}</div><div class="section-head"><div class="section-title">État des vérifications</div><div class="section-sub">Résultats calculés sur le corpus publié</div></div><div class="two-col">${distributions()}${notePanel()}</div><div class="section-head"><div class="section-title">Responsables suivis</div><button class="textlink" data-nav="people">Tous les responsables →</button></div>${peopleCards(PEOPLE.filter(p=>p.candidacy==='institution'))}<div class="section-head"><div class="section-title">Présidentielle de 2027</div><button class="textlink" data-nav="people">Voir toutes les candidatures →</button></div><div class="notice">${PEOPLE.filter(p=>p.candidacy==='annoncee').length} candidatures annoncées et ${PEOPLE.filter(p=>p.candidacy==='envisagee').length} personnalités pressenties ou conditionnelles, recensées au 22 novembre 2026. Toutes les candidatures et les déclarations du mois ne sont pas encore recensées. <button class="textlink" data-nav="comparatif">Ouvrir le tableau comparatif →</button></div><div class="section-head"><div class="section-title">Affirmations des candidats à la présidentielle</div><button class="textlink" data-candidate-claims>Voir toutes les affirmations des candidats →</button></div><p class="section-sub" style="margin-bottom:13px">${data.claims.filter(c=>PEOPLE.some(p=>p.id===c.personId&&p.candidacy!=='institution')).length} affirmations documentées ou en cours de contrôle concernant les candidats et personnalités envisagées</p><div class="claim-list">${data.claims.filter(c=>PEOPLE.some(p=>p.id===c.personId&&p.candidacy!=='institution')).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(claimCard).join('')}</div><div class="section-head"><div class="section-title">Déclarations les plus récentes (par date)</div><button class="textlink" data-nav="claims">Tout voir →</button></div><div class="claim-list">${recent.length?recent.map(claimCard).join(''):emptyClaims()}</div><div class="footnote">Corpus documentaire glissant  au total, non exhaustif. Les déclarations plus anciennes restent accessibles depuis l'onglet Affirmations. Les conclusions sont des analyses préliminaires accompagnées de sources et restent susceptibles d'être corrigées. Aucune nouvelle déclaration n'est collectée automatiquement.</div>`}
function claims(){const list=[...data.claims].filter(c=>(filterScope==='all'||(filterScope==='candidats'?PEOPLE.some(p=>p.id===c.personId&&p.candidacy!=='institution'):PEOPLE.some(p=>p.id===c.personId&&p.candidacy==='institution')))&&(filterPerson==='all'||c.personId===filterPerson)&&(filterStatus==='all'||c.status===filterStatus)&&(!filterSearch||[c.claim,c.theme,c.context,person(c.personId).name].some(x=>x.toLowerCase().includes(filterSearch.toLowerCase())))).sort((a,b)=>b.date.localeCompare(a.date));return header('Base documentaire','Affirmations','Toutes les affirmations recensées, sans limite de date. Recherche et filtres par personne et conclusion.')+`<div class="people-tabs"><button class="btn btn-sm ${filterScope==='all'?'btn-primary':''}" data-claim-scope="all">Toutes (${data.claims.length})</button><button class="btn btn-sm ${filterScope==='candidats'?'btn-primary':''}" data-claim-scope="candidats">Candidats 2027 (${data.claims.filter(c=>PEOPLE.some(p=>p.id===c.personId&&p.candidacy!=='institution')).length})</button><button class="btn btn-sm ${filterScope==='institutions'?'btn-primary':''}" data-claim-scope="institutions">Institutions (${data.claims.filter(c=>PEOPLE.some(p=>p.id===c.personId&&p.candidacy==='institution')).length})</button></div><div class="filters"><input id="searchClaims" class="control search" placeholder="Rechercher une affirmation…" value="${h(filterSearch)}" aria-label="Rechercher"><select class="control" id="filterPerson"><option value="all">Tous les responsables</option>${PEOPLE.map(p=>`<option value="${p.id}" ${filterPerson===p.id?'selected':''}>${h(p.name)}</option>`).join('')}</select><select class="control" id="filterStatus"><option value="all">Tous les états</option>${Object.entries(STATUSES).map(([id,s])=>`<option value="${id}" ${filterStatus===id?'selected':''}>${h(s.label)}</option>`).join('')}</select></div><div class="section-sub" style="margin-bottom:13px">${list.length} affirmation(s) trouvée(s). Résultats classés par date de déclaration.</div><div class="claim-list" id="claimsItems">${list.length?list.map(claimCard).join(''):emptyClaims()}</div>`}
function people(){const a=PEOPLE.filter(p=>p.candidacy===peopleGroup&&(!peopleSearch||[p.name,p.party||p.role].join(' ').toLocaleLowerCase('fr').includes(peopleSearch.toLocaleLowerCase('fr'))));const tabs=[['annoncee','Candidatures annoncées'],['envisagee','Envisagées / conditionnelles'],['retiree','Candidatures retirées'],['institution','Institutions']];return header('Présidentielle 2027','Responsables politiques',PEOPLE.filter(p=>p.candidacy==='annoncee').length+' candidatures annoncées, '+PEOPLE.filter(p=>p.candidacy==='envisagee').length+' personnalités pressenties ou conditionnelles, 3 responsables institutionnels. État au 22 novembre 2026. Aucune candidature n’est encore validée par le Conseil constitutionnel.')+`<div class="people-tabs">${tabs.map(([k,l])=>`<button class="btn btn-sm ${peopleGroup===k?'btn-primary':''}" data-group="${h(k)}">${h(l)} (${PEOPLE.filter(p=>p.candidacy===k).length})</button>`).join('')}</div><div class="filters"><input id="peopleSearch" class="control search" type="search" placeholder="Rechercher un nom ou un parti…" aria-label="Rechercher un responsable" value="${h(peopleSearch)}"></div><p class="section-sub" style="margin-bottom:14px">${a.length} profil(s) dans cette catégorie. Ouvrir un profil pour consulter la répartition de ses affirmations.</p>${a.length?peopleCards(a):'<div class="empty">Aucune personne trouvée dans cette catégorie.</div>'}<div class="notice" style="margin-top:24px">Les chiffres décrivent uniquement les affirmations recensées : ils ne constituent pas une note de fiabilité de la personne. Pas de données = non évalué, et non pas zéro faute. Les corpus ne sont pas comparables à ce stade.</div><div class="footnote">Ce recensement est une sélection documentaire étendue, pas une liste électorale officielle ni nécessairement exhaustive. <a href="${h(safeUrl('https://lcp.fr/actualites/presidentielle-2027-la-liste-des-candidats-declares-et-potentiels-444932'))}" target="_blank" rel="noopener">Source de référence : LCP, 20 novembre 2026 ↗</a>. Les annonces plus récentes sont prises en compte individuellement.</div>`}
function compareHeader(key,label){const active=compareSort===key;const order=compareDirection==='asc'?'ascending':'descending';const symbol=active?(compareDirection==='asc'?'↑':'↓'):'↕';return '<th scope="col"'+(active?' aria-sort="'+order+'"':'')+'><button type="button" class="compare-sort'+(active?' is-active':'')+'" data-compare-sort="'+h(key)+'" aria-label="Trier par '+h(label.toLowerCase())+(active?', inverser l’ordre':'')+'">'+h(label)+' <span aria-hidden="true" class="sort-symbol">'+symbol+'</span></button></th>'}
function comparison(){const list=PEOPLE.filter(p=>p.candidacy==='annoncee'||p.candidacy==='envisagee'||p.candidacy==='retiree').sort((a,b)=>{const val=p=>{if(compareSort==='name')return p.name;const cs=data.claims.filter(c=>c.personId===p.id);if(compareSort==='total')return cs.length;if(compareSort==='analysed')return cs.filter(c=>c.status!=='attente').length;return cs.filter(c=>c.status===compareSort).length};const x=val(a),y=val(b);const diff=compareSort==='name'?x.localeCompare(y,'fr'):x-y;return diff?(compareDirection==='asc'?diff:-diff):a.name.localeCompare(b.name,'fr')});const states=['confirme','nuance','contredit','indetermine','attente'];const rows=list.map(p=>{const cs=data.claims.filter(c=>c.personId===p.id);const done=cs.filter(c=>c.status!=='attente').length;return `<tr><td><div class="compare-person">${portrait(p,"avatar-small")}<div><button class="textlink" data-person="${h(p.id)}">${h(p.name)}</button><div class="mini-meta">${h(p.candidacy==='annoncee'?'Candidature annoncée':p.candidacy==='retiree'?'Candidature retirée':'Candidature envisagée ou conditionnelle')}</div></div></div></td><td class="num">${cs.length}</td><td class="num">${done?done:'Non évalué'}</td>${states.map(k=>`<td class="num">${cs.filter(c=>c.status===k).length}</td>`).join('')}</tr>`}).join('');return header('Présidentielle 2027','Comparatif des faits','Tableau descriptif des affirmations recensées. Cliquez sur les titres des colonnes pour trier les données, puis à nouveau pour inverser le sens du tri. Aucun classement de fiabilité personnelle n’est attribué.')+`<div class="notice"><b>Lecture :</b> les chiffres décrivent ce petit corpus, pas la proportion de déclarations véridiques de chaque responsable. « Non évalué » signifie qu’aucune affirmation n’a été contrôlée. Les résultats sont des analyses préliminaires non validées par une rédaction indépendante. Les candidatures restent soumises aux règles électorales.</div><div class="panel" style="padding:0;overflow:hidden"><div class="compare-wrap"><table class="compare-table"><thead><tr>${[['name','Responsable'],['total','Recensées'],['analysed','Analysées'],['confirme','Confirmées'],['nuance','À nuancer'],['contredit','Contredites'],['indetermine','Indéterminées'],['attente','En attente']].map(([k,l])=>compareHeader(k,l)).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div><p class="footnote">La sélection d’affirmations n’est pas exhaustive ni échantillonnée de manière représentative. La comparaison de petits nombres, en particulier avec des personnes ne disposant d'aucune fiche, ne permet aucune conclusion sur leur honnêteté.</p>`}
function methods(){const items=[['Sélection des déclarations','Recenser les interventions de manière documentée, sans sélectionner uniquement les phrases spectaculaires. Conserver les dates, les liens et le contexte.'],['Délimitation de l’affirmation','Distinguer les faits contrôlables des opinions, intentions, promesses et prédictions. Isoler une proposition à la fois sans déformer le sens.'],['Recherche contradictoire','Recouper les données auprès de sources datées, officielles et indépendantes. Examiner la définition des indicateurs, leur période et le champ couvert.'],['Décision justifiée','Classer comme confirmé, à nuancer, contredit ou indéterminé. Toute conclusion exige au minimum une source probante complémentaire et une explication.'],['Droit de réponse et corrections','Conserver les changements de statut, le motif et la date. Prévoir un droit de réponse avant publication publique pour les cas sensibles.'],['Transparence des mesures','Afficher le nombre de déclarations recensées, le volume réellement contrôlé et la distribution des conclusions. Éviter les classements simplificateurs.']];return header('Référentiel éditorial','Une méthode explicite','Le verdict ne dépend ni de la personne ni de son orientation politique, mais de la force des preuves disponibles.')+`<div class="methods">${items.map((m,i)=>`<section class="method"><div class="method-no">PRINCIPE ${String(i+1).padStart(2,'0')}</div><h3>${h(m[0])}</h3><p>${h(m[1])}</p></section>`).join('')}</div><div class="section-head"><div class="section-title">Références méthodologiques</div></div><div class="panel"><p><a target="_blank" rel="noopener" href="https://efcsn.com/code-of-standards/">EFCSN · Code de déontologie européen ↗</a></p><p><a target="_blank" rel="noopener" href="https://fullfact.org/about/how-we-fact-check/">Full Fact · Méthode de vérification ↗</a></p><p><a target="_blank" rel="noopener" href="https://schema.org/ClaimReview">Schema.org · Format ClaimReview ↗</a></p><p><a target="_blank" rel="noopener" href="https://data.assemblee-nationale.fr/travaux-parlementaires/debats">Assemblée nationale · Données des débats ↗</a></p></div>`}
function render(){renderNav();const node=document.getElementById('content');node.innerHTML=({overview,claims,people,comparatif:comparison,method:methods})[view]();if(view==='claims'){document.getElementById('filterPerson').value=filterPerson;document.getElementById('filterStatus').value=filterStatus}updateImagesInDom();resolveWikipediaPortraits()}
function detail(id){const c=data.claims.find(x=>x.id===id);if(!c)return;let p=person(c.personId);let history=(c.history||[]).map(x=>`<div class="source-item" style="margin-bottom:7px">${dateFr(x.at.slice(0,10))} · ${h(x.action)}</div>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="modal" id="modal"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Détail de l'affirmation"><div class="modal-top"><div class="eyebrow">Affirmation ${h(c.id)}</div><button class="modal-close" data-close aria-label="Fermer">×</button></div><div class="claim-detail-author">${portrait(p,"avatar-claim")}<div><strong>${h(p.name)}</strong><div class="mini-meta">${dateFr(c.date)} · ${h(c.theme)}</div></div></div><h2 class="modal-title">${h(c.claim)}</h2><div class="claim-foot" style="margin-bottom:17px">${statusChip(c.status)}</div><div class="detail-block"><b>Contexte</b><p>${h(c.context||'Non renseigné')}</p></div>${c.rawQuote?`<div class="detail-block"><b>Extrait de la déclaration</b><p>${h(c.rawQuote)}</p></div>`:''}<div class="detail-block"><b>Source originale</b><p class="sources-list"><a target="_blank" rel="noopener noreferrer" class="source-item" href="${h(safeUrl(c.source))}">${h(c.source)}</a></p></div><div class="detail-block"><b>Justification de la conclusion</b><p>${h(c.explanation||'Aucune vérification indépendante publiée pour le moment.')}</p></div><div class="detail-block"><b>Sources documentaires complémentaires</b><p class="sources-list">${(Array.isArray(c.evidenceLinks)&&c.evidenceLinks.length?c.evidenceLinks:c.evidence?[c.evidence]:[]).map(url=>`<a target="_blank" rel="noopener noreferrer" class="source-item" href="${h(safeUrl(url))}">${h(url)}</a>`).join('')||'Non renseignée'}</p></div><div class="detail-block"><b>Historique</b>${history||'<p>Historique vide.</p>'}</div><div class="action-row" style="margin-top:20px"><button class="btn" data-close>Fermer</button></div></div></div>`;updateImagesInDom()}
function profile(id){const p=PEOPLE.find(x=>x.id===id);if(!p)return;const list=data.claims.filter(c=>c.personId===id);const analysed=list.filter(c=>c.status!=='attente');const countsBy=Object.keys(STATUSES).map(s=>`<span class="person-metric"><b>${list.filter(c=>c.status===s).length}</b> ${h(STATUSES[s].label.toLowerCase())}</span>`).join('');const ratio=list.length?Math.round(100*analysed.length/list.length):null;const source=p.candidacySource||p.source;const cand=p.candidacy==='annoncee'?'Candidature annoncée':p.candidacy==='envisagee'?'Candidature pressentie / conditionnelle':p.candidacy==='retiree'?'Candidature retirée':'Responsable institutionnel';document.getElementById('modalRoot').innerHTML=`<div class="modal" id="modal"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Profil politique"><div class="modal-top"><div class="eyebrow">${h(cand)}</div><button class="modal-close" data-close aria-label="Fermer">×</button></div><div class="profile-heading">${portrait(p,"avatar-large")}<div><h2 class="modal-title">${h(p.name)}</h2><div class="detail-meta">${h(p.role)}</div></div></div>${p.candidacyNote?`<div class="notice">${h(p.candidacyNote)}</div>`:''}<div class="detail-block"><b>Indicateurs documentaires, pas une note personnelle</b><p>${list.length?list.length+' affirmation(s) recensée(s), dont '+analysed.length+' analysée(s) ('+ratio+' % de couverture du corpus recensé).':'Aucune affirmation contrôlée pour cette personne à ce stade.'}</p><div class="person-metrics">${countsBy}</div></div>${p.photoSource?`<div class="detail-block"><b>Crédit et licence du portrait</b><a target="_blank" rel="noopener noreferrer" href="${h(p.photoSource)}">Voir la fiche de la photographie sur Wikimedia Commons</a></div>`:""}<div class="detail-block"><b>Source du statut</b><p><a href="${h(safeUrl(source))}" target="_blank" rel="noopener noreferrer">${h(source)}</a></p></div>${list.length?`<div class="detail-block"><b>Affirmations du registre</b><div class="claim-list">${list.slice(0,6).map(claimCard).join('')}</div></div>`:''}<div class="action-row"><button class="btn btn-primary" data-person-claims="${h(p.id)}">Voir ses affirmations</button><button class="btn" data-close>Fermer</button></div></div></div>`;updateImagesInDom()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
document.addEventListener('click',e=>{const sh=e.target.closest('[data-compare-sort]');if(sh){const key=sh.dataset.compareSort;if(compareSort===key)compareDirection=compareDirection==='asc'?'desc':'asc';else{compareSort=key;compareDirection=key==='name'?'asc':'desc'}const previous=document.querySelector('.compare-wrap')?.scrollLeft||0;render();const next=document.querySelector('.compare-wrap');if(next)next.scrollLeft=previous;return}let t=e.target.closest('[data-nav]');if(t){navTo(t.dataset.nav);return}let x=e.target.closest('[data-person]');if(x){profile(x.dataset.person);return}if(e.target.closest('[data-candidate-claims]')){filterScope='candidats';filterPerson='all';filterStatus='all';filterSearch='';navTo('claims');return}const scope=e.target.closest('[data-claim-scope]');if(scope){filterScope=scope.dataset.claimScope;filterPerson='all';filterStatus='all';filterSearch='';render();return}let pc=e.target.closest('[data-person-claims]');if(pc){closeModal();filterPerson=pc.dataset.personClaims;filterScope='all';filterStatus='all';filterSearch='';navTo('claims');return}let grp=e.target.closest('[data-group]');if(grp){peopleGroup=grp.dataset.group;render();return}let c=e.target.closest('[data-open]');if(c){detail(c.dataset.open);return}if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return}});
document.addEventListener('change',e=>{if(e.target.id==='filterPerson'){filterPerson=e.target.value;render()}if(e.target.id==='filterStatus'){filterStatus=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='peopleSearch'){peopleSearch=e.target.value;const focus=e.target.selectionStart;render();let inp=document.getElementById('peopleSearch');inp.focus();inp.setSelectionRange(focus,focus)}if(e.target.id==='searchClaims'){filterSearch=e.target.value;const focus=e.target.selectionStart;render();let inp=document.getElementById('searchClaims');inp.focus();inp.setSelectionRange(focus,focus)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script></body></html>
