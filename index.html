font-weight:650;white-space:nowrap}.btn:hover{border-color:#b4c5ba;background:#f9fbf9}.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-primary:hover{background:#2a4438;border-color:#2a4438}.btn-quiet{background:transparent;border-color:transparent}.btn-sm{font-size:12px;padding:8px 10px}.page{max-width:1360px;margin:0 auto;padding:48px clamp(22px,5%,72px) 75px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-weight:750;color:var(--green);font-size:10px;margin-bottom:11px}.page-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:31px}.page-header h1{margin:0;font-size:clamp(30px,3.5vw,46px);font-weight:720;line-height:1.13;letter-spacing:-.058em}.lead{margin:10px 0 0;color:#6d7971;font-size:14px;max-width:680px}.section-title{font-weight:750;font-size:17px;letter-spacing:-.03em}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:38px 0 16px}.section-sub{font-size:12px;color:#8b958c}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:23px;box-shadow:var(--shadow)}.stat-label{color:#738179;font-weight:650;font-size:11px}.stat-value{font-size:34px;letter-spacing:-.05em;font-weight:750;margin-top:11px;line-height:1.2;font-variant-numeric:tabular-nums}.stat-help{font-size:11px;color:#8b968e;margin-top:10px}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:24px}.panel h3{margin:0 0 4px;font-size:15px}.panel p{color:#7c877e}.dist-bar{height:13px;background:#edf1eb;border-radius:50px;display:flex;overflow:hidden;margin:25px 0 20px}.dist-seg{height:100%;transition:width .25s}.dist-legend{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dist-item{font-size:12px;color:#66766b;display:flex;justify-content:space-between;align-items:center;gap:12px}.dist-item strong{color:var(--ink);font-variant-numeric:tabular-nums}.dot{height:8px;width:8px;display:inline-block;border-radius:50%;margin-right:7px}.people-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.person{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--paper);text-align:left;transition:.15s}.person:hover{transform:translateY(-2px);box-shadow:0 8px 25px #122a1a0c}.person-top{display:flex;align-items:center;gap:12px}.avatar{height:45px;width:45px;flex:none;border-radius:50%;background:#e5eee7;display:grid;place-items:center;font-size:15px;font-weight:780;color:#2d5441}.person-name{font-weight:730;font-size:14px}.person-role{font-size:11px;color:#7d897f}.person-bottom{display:flex;align-items:center;justify-content:space-between;color:#839088;margin-top:21px;font-size:11px}.person-bottom b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}.claim-list{display:grid;gap:10px}.claim-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:20px 23px;box-shadow:var(--shadow);cursor:pointer;transition:.14s}.claim-card:hover{border-color:#b9cbc0}.claim-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.mini-meta{font-size:11px;color:#879289}.claim-text{font-size:15px;line-height:1.5;font-weight:635;letter-spacing:-.015em;margin:13px 0 12px}.claim-foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:750;letter-spacing:.01em;white-space:nowrap;background:#f0f2ee;color:#596c5d}.chip.confirme{background:var(--greenlight);color:var(--green)}.chip.nuance{background:var(--amberlight);color:var(--amber)}.chip.contredit{background:var(--redlight);color:var(--red)}.chip.indetermine{background:#eaf0f7;color:var(--blue)}.chip.attente{background:#f0f2ee;color:#68766e}.chip.theme{background:#f6f7f4;border:1px solid #e8ece6;color:#778177}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.control{background:white;border:1px solid #dfe7df;border-radius:9px;padding:11px 12px;min-height:42px;color:var(--ink);width:100%}.filters select{min-width:170px;width:auto}.search{width:min(330px,100%)}.empty{padding:65px 25px;text-align:center;border:1px dashed #cbd9ce;border-radius:13px;background:#fbfcfa;color:#829088}.empty .empty-icon{font-size:28px;margin-bottom:10px}.empty strong{display:block;color:#485c4e}.empty p{margin:8px auto 0;max-width:380px;font-size:12px}.empty button{margin-top:17px}.textlink{border:0;background:none;font-weight:700;color:var(--green);padding:5px 0}.methods{display:grid;grid-template-columns:1fr 1fr;gap:16px}.method{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px}.method-no{font-size:11px;color:var(--green);font-weight:760}.method h3{font-size:16px;letter-spacing:-.02em;margin:15px 0 8px}.method p{font-size:12px;color:#718078;line-height:1.7}.form-wrap{max-width:810px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px;margin-bottom:19px}.field label{font-size:11px;font-weight:720;color:#4d6155}.field .hint{font-size:10px;color:#8c9990;margin-top:-4px}.field textarea{min-height:105px;resize:vertical}.span2{grid-column:span 2}.form-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;padding-top:16px;border-top:1px solid var(--line)}.form-foot p{color:#809087;font-size:11px;max-width:410px}.subtle{color:#829088;font-size:12px}.modal{position:fixed;inset:0;z-index:30;background:#17291e88;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto}.modal-panel{width:min(700px,100%);max-height:calc(100vh - 30px);overflow:auto;background:white;border-radius:15px;box-shadow:0 25px 80px #0003;padding:30px}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-title{font-size:22px;letter-spacing:-.045em;margin:10px 0 0;line-height:1.3}.modal-close{background:#f0f3ef;border:0;border-radius:7px;font-size:18px;width:30px;height:30px}.detail-meta{margin:12px 0 20px;color:#829087;font-size:11px}.detail-block{padding:15px 0;border-top:1px solid var(--line)}.detail-block b{display:block;font-size:11px;color:#526258;margin-bottom:6px}.detail-block p{margin:0;color:#59695f;white-space:pre-wrap;overflow-wrap:anywhere}.sources-list{display:grid;gap:5px}.source-item{font-size:12px;overflow-wrap:anywhere}.toast{position:fixed;z-index:40;bottom:20px;right:22px;max-width:340px;background:#213a2b;color:#fff;padding:13px 16px;border-radius:9px;font-size:12px;box-shadow:0 15px 40px #0002}.hide{display:none!important}.footnote{margin-top:36px;color:#8b968e;font-size:11px;line-height:1.7}.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file-input{display:none}.notice{font-size:12px;background:#f0f6f0;border:1px solid #dce8dc;border-radius:10px;padding:14px 17px;color:#536a58;margin-bottom:20px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}@media(max-width:780px){.app{display:block}.sidebar{position:static;height:auto;padding:16px;gap:9px}.brand{margin:0}.side-label,.side-note{display:none}.nav{display:flex;overflow-x:auto;scrollbar-width:thin;gap:3px}.nav button{white-space:nowrap;gap:6px;font-size:11px;padding:8px 10px}.nav svg{width:15px;height:15px}.topbar{top:0;height:58px;padding:0 20px}.page{padding:31px 20px 60px}.page-header{align-items:flex-start;flex-direction:column}.people-grid,.methods{grid-template-columns:1fr}.stat{padding:17px}.stat-value{font-size:28px}.panel{padding:19px}.form-wrap{padding:20px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.modal-panel{padding:20px}}
@media(max-width:420px){.btn.small-hide{display:none}.tag-beta{display:none}.stats{gap:8px}.stat{padding:13px}.stat-label{font-size:10px}.stat-value{font-size:26px}.claim-card{padding:17px}.filters select,.filters .search{width:100%}}

<script>
'use strict';
const PEOPLE=[
{id:'macron',name:'Emmanuel Macron',role:'Président de la République',initials:'EM',source:'https://www.elysee.fr/'},
{id:'lecornu',name:'Sébastien Lecornu',role:'Premier ministre',initials:'SL',source:'https://www.info.gouv.fr/personnalite/sebastien-lecornu'},

];
const STATUSES={attente:{label:'À vérifier',color:'#7c8880'},confirme:{label:'Confirmé',color:'#24805b'},nuance:{label:'À nuancer',color:'#d69b36'},contredit:{label:'Contredit',color:'#bd544b'},indetermine:{label:'Indéterminé',color:'#4776ad'}};
const SEED=[{"id":"pub-macron-104","personId":"macron","claim":"La Grande Exposition du Fabriqué en France de 2026 compte 104 lauréats.","rawQuote":"« les 104 lauréats »","date":"2026-11-20","theme":"Économie","context":"Discours d'inauguration de la 6e édition à l'Élysée","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"confirme","explanation":"Le discours du 20 novembre mentionne 104 lauréats. L'Élysée avait publié le 22 octobre la sélection de 104 produits/services retenus par le jury national. Chiffre administratif corroboré entre deux documents institutionnels, sans audit externe du nombre d'exposants.","evidence":"https://www.elysee.fr/emmanuel-macron/2026/10/22/la-grande-exposition-du-fabrique-en-france-revient-en-2026","evidenceLinks":["https://www.elysee.fr/emmanuel-macron/2026/10/22/la-grande-exposition-du-fabrique-en-france-revient-en-2026"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-apprentis","personId":"macron","claim":"La France compte plus d'un million d'apprentis, contre environ 426 000 en 2017.","rawQuote":"","date":"2026-11-20","theme":"Emploi","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"nuance","explanation":"L'effectif de 2017 était de 425 953 apprentis au 31 décembre (rapport parlementaire). La DEPP mesure 1 020 400 apprentis fin 2025 et la DARES 1 017 500 contrats en cours à la même date. L'ordre de grandeur et le doublement sont corroborés. En revanche, ces séries ne démontrent pas à elles seules un effectif supérieur à un million précisément le 20 novembre 2026. Attention à ne pas confondre apprentis présents et nouveaux contrats annuels.","evidence":"https://www.education.gouv.fr/depp/l-apprentissage-au-31-decembre-2025-une-baisse-des-effectifs-de-28-par-rapport-2024-505299","evidenceLinks":["https://www.education.gouv.fr/depp/l-apprentissage-au-31-decembre-2025-une-baisse-des-effectifs-de-28-par-rapport-2024-505299","https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L16B1745-tIII-a47.html","https://dares.travail-emploi.gouv.fr/donnees/le-contrat-dapprentissage"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-eti","personId":"macron","claim":"La France est passée d'environ 5 400 entreprises de taille intermédiaire en 2017 à environ 7 500 aujourd'hui.","rawQuote":"","date":"2026-11-20","theme":"Économie","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"nuance","explanation":"L'INSEE recense 5 400 ETI en 2017 et près de 7 500 en 2023 (7 296 selon la série détaillée), dans les secteurs principalement marchands non agricoles et non financiers. La progression est documentée, mais le chiffre de 7 500 cité comme actuel en novembre 2026 correspond à une observation statistique antérieure. Il ne s'agit pas d'un décompte vérifié pour 2026.","evidence":"https://www.insee.fr/fr/statistiques/4255712","evidenceLinks":["https://www.insee.fr/fr/statistiques/4255712","https://www.insee.fr/fr/statistiques/8675639","https://www.insee.fr/fr/statistiques/2016091"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-usines","personId":"macron","claim":"Le solde cumulé des ouvertures et fermetures d'usines depuis 2017 serait de +300.","rawQuote":"« 300 ouvertures d'usines sur notre territoire en net »","date":"2026-11-20","theme":"Économie","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"indetermine","explanation":"Le baromètre industriel de la Direction générale des Entreprises relève un solde de +19 ouvertures et extensions en 2025, contre +88 en 2024. Il ne permet pas, isolément, d'attester le cumul de +300 depuis 2017 : périmètre (sites de plus de 20 salariés), définition d'extension et années étudiées doivent être harmonisés. Je ne sais pas confirmer le solde cumulé avancé sans reconstituer la série complète.","evidence":"https://www.entreprises.gouv.fr/espace-presse/barometre-industriel-de-letat-dossier-de-presse","evidenceLinks":["https://www.entreprises.gouv.fr/espace-presse/barometre-industriel-de-letat-dossier-de-presse"],"reviewer":"Analyse documentaire préliminaire (IA, non relue)","reviewedAt":"2026-11-22","createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Analyse documentaire préliminaire établie le 22 novembre 2026. À faire relire avant utilisation éditoriale."}]},{"id":"pub-macron-emplois","personId":"macron","claim":"Depuis mi-2017, 2,5 millions d'emplois auraient été créés, dont 1,8 million d'emplois salariés.","rawQuote":"","date":"2026-11-20","theme":"Emploi","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"attente","explanation":"Le discours donne ces deux chiffres, mais la présente sélection n'a pas reconstitué une série INSEE homogène de mi-2017 à mi-2026, couvrant salariés et non-salariés. L'INSEE mesure 30,5 millions de personnes en emploi fin 2025, et +1,2 million d'emplois salariés depuis fin 2019. Ces périodes différentes ne suffisent pas à valider les chiffres cités.","evidence":"https://www.insee.fr/fr/statistiques/8733039","evidenceLinks":["https://www.insee.fr/fr/statistiques/8733039"],"reviewer":"","reviewedAt":null,"createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Affirmation recensée le 22 novembre 2026. Vérification indépendante à poursuivre."}]},{"id":"pub-macron-industrie","personId":"macron","claim":"Le nombre d'emplois industriels aurait augmenté d'environ 100 000 depuis 2017.","rawQuote":"","date":"2026-11-20","theme":"Emploi","context":"Discours d'inauguration de la Grande Exposition du Fabriqué en France","source":"https://www.elysee.fr/emmanuel-macron/2026/11/20/inauguration-de-la-grande-exposition-du-fabrique-en-france-2026","status":"attente","explanation":"Le discours affirme une hausse proche de 100 000. Les statistiques INSEE sur l'emploi industriel au deuxième trimestre 2026 doivent être comparées à une base 2017 de même champ (emploi salarié, intérim, branche et secteur). Sans cette comparaison harmonisée, pas de verdict fiable.","evidence":"https://www.insee.fr/fr/statistiques/9039152","evidenceLinks":["https://www.insee.fr/fr/statistiques/9039152"],"reviewer":"","reviewedAt":null,"createdAt":"2026-11-22","history":[{"at":"2026-11-22","action":"Affirmation recensée le 22 novembre 2026. Vérification indépendante à poursuivre."}]},{"id":"pub-lecornu-cybervote","personId":"lecornu","claim":"Le projet de loi sur la résilience des infrastructures critiques et la cybersécurité a été adopté par l'Assemblée nationale le 17 novembre 2026.","rawQuote":"","date":"2026-11-19","theme":"Sécurité","context":"Présentation du plan gouvernemental de cybersécurité","source":"https://www.info.gouv.fr/discours/cybersecurite-l-etat-renforce- const KEY='paroles-preuves-prototype-v1';let data=load();let view='overview';let filterPerson='all';let filterStatus='all';let filterSearch='';let selectedPerson='all';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.claims)){const ids=new Set(SEED.map(c=>c.id));const personnels=v.claims.filter(c=>!ids.has(c.id)&&c.id!=='source-001');return{version:2,claims:[...structuredClone(SEED),...personnels]}}}catch(e){}return{version:2,claims:structuredClone(SEED)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(u){try{let p=new URL(u);return ['https:','http:'].includes(p.protocol)?p.href:''}catch(e){return ''}}
function person(id){return PEOPLE.find(p=>p.id===id)||{name:'Responsable inconnu',role:'',initials:'?'}}
function dateFr(d){if(!d)return 'Date non renseignée';const v=new Date(d+'T12:00:00');return Number.isFinite(v.getTime())?new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(v):h(d)}
function statusChip(s){return `<span class="chip ${h(s)}"><span class="dot" style="background:${STATUSES[s]?.color||'#888'}"></span>${h(STATUSES[s]?.label||s)}</span>`}
function nPerson(id){return data.claims.filter(c=>c.personId===id).length}
function counts(){let checked=data.claims.filter(x=>x.status!=='attente').length;return {total:data.claims.length,checked,pending:data.claims.length-checked,coverage:data.claims.length?Math.round(100*checked/data.claims.length):0}}
const NAV=[['overview','Vue générale','grid'],['claims','Affirmations','file'],['people','Responsables','users'],['method','Méthodologie','shield'],['new','Ajouter une affirmation','plus']];
function ico(k){return ({grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',file:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2M17 5a3 3 0 0 1 0 6M19 14a6 6 0 0 1 3 5"/>',shield:'<path d="m12 22 8-5V5l-8-3-8 3v12zM9 12l2 2 4-4"/>',plus:'<path d="M12 4v16M4 12h16"/>'})[k]||''}
function navTo(v){view=v;render();scrollTo({top:0,behavior:'instant'})}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([id,t,i])=>`<button class="${view===id?'active':''}" data-nav="${id}"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">${ico(i)}</svg>${h(t)}</button>`).join('');document.getElementById('crumb').textContent=NAV.find(n=>n[0]===view)?.[1]||'Vue générale'}
function header(k,title,desc,action=''){return `<div class="page-header"><div><div class="eyebrow">${h(k)}</div><h1>${h(title)}</h1><p class="lead">${h(desc)}</p></div>${action}</div>`}
function stat(label,val,help){return `<div class="stat"><div class="stat-label">${h(label)}</div><div class="stat-value">${h(val)}</div><div class="stat-help">${h(help)}</div></div>`}
function peopleCards(){return `<div class="people-grid">${PEOPLE.map(p=>`<button class="person" data-person="${h(p.id)}"><div class="person-top"><div class="avatar">${h(p.initials)}</div><div><div class="person-name">${h(p.name)}</div><div class="person-role">${h(p.role)}</div></div></div><div class="person-bottom"><span>Affirmations recensées</span><b>${nPerson(p.id)}</b></div></button>`).join('')}</div>`}
function distributions(){const arr=['confirme','nuance','contredit','indetermine'];const verified=data.claims.filter(x=>x.status!=='attente');return `<div class="panel"><h3>Répartition des vérifications</h3><p class="subtle">Répartition des analyses documentaires initiales, non validées par une rédaction indépendante.</p><div class="dist-bar">${arr.map(s=>`<div class="dist-seg" style="width:${verified.length?Math.round(100*verified.filter(x=>x.status===s).length/verified.length):0}%;background:${STATUSES[s].color}"></div>`).join('')}</div><div class="dist-legend">${arr.map(s=>`<div class="dist-item"><span><span class="dot" style="background:${STATUSES[s].color}"></span>${STATUSES[s].label}</span><strong>${verified.filter(x=>x.status===s).length}</strong></div>`).join('')}</div><p class="subtle" style="margin:23px 0 0">${verified.length?'Sur '+verified.length+' vérification(s) publiée(s).':'Aucune analyse documentaire à ce stade.'}</p></div>`}
function notePanel(){return `<div class="panel"><h3>Principes éditoriaux</h3><p class="subtle" style="margin-top:6px">Les conclusions affichées sont préliminaires et n'ont pas fait l'objet d'une validation éditoriale humaine indépendante. Une déclaration n’est pas automatiquement vraie ou fausse.</p><div style="display:grid;gap:15px;margin-top:23px"><div><b style="font-size:12px">01. Citation d’origine</b><div class="subtle">Discours, entretien ou publication identifiable.</div></div><div><b style="font-size:12px">02. Documents contradictoires</b><div class="subtle">Sources datées et indépendantes, autant que possible.</div></div><div><b style="font-size:12px">03. Justification écrite</b><div class="subtle">Périmètre, période, limites et historique des corrections.</div></div></div><button class="textlink" data-nav="method" style="margin-top:15px">Consulter la méthode →</button></div>`}
function claimCard(c){return `<article class="claim-card" data-open="${h(c.id)}"><div class="claim-head"><span class="mini-meta">${h(person(c.personId).name)} · ${dateFr(c.date)}</span>${statusChip(c.status)}</div><div class="claim-text">${h(c.claim)}</div><div class="claim-foot"><span class="chip theme">${h(c.theme||'Autre')}</span><span class="mini-meta">${h(c.context||'Contexte non renseigné')}</span></div></article>`}
function emptyClaims(text='Aucune affirmation ne correspond aux filtres.'){return `<div class="empty"><div class="empty-icon">⌕</div><strong>${h(text)}</strong><p>Ajoutez une déclaration sourcée pour démarrer le suivi éditorial.</p><button class="btn btn-sm btn-primary" data-nav="new">Ajouter une affirmation</button></div>`}
function overview(){const c=counts();const recent=[...data.claims].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return header('Observation publique','Les faits, derrière les mots.','Un registre vérifiable des affirmations de responsables politiques. Les résultats sont publiés avec leurs sources et leurs limites.',`<button class="btn btn-primary" data-nav="claims">Explorer les affirmations →</button>`)+`<div class="stats">${stat('Affirmations recensées',c.total,'Corpus public + ajouts locaux')}${stat('Vérifications documentées',c.checked,'Analyses préliminaires documentées')}${stat('À examiner',c.pending,'Aucun verdict publié')}${stat('Couverture du corpus',c.coverage+' %','Part des affirmations examinées')}</div><div class="section-head"><div class="section-title">État des vérifications</div><div class="section-sub">Résultats calculés sur les données présentes</div></div><div class="two-col">${distributions()}${notePanel()}</div><div class="section-head"><div class="section-title">Responsables suivis</div><button class="textlink" data-nav="people">Tous les responsables →</button></div>${peopleCards()}<div class="section-head"><div class="section-title">Dernières affirmations recensées</div><button class="textlink" data-nav="claims">Tout voir →</button></div><div class="claim-list">${recent.length?recent.map(claimCard).join(''):emptyClaims()}</div><div class="footnote">Cette démonstration est hébergée publiquement, mais les saisies et vérifications sont stockées uniquement dans ce navigateur. Aucune donnée ajoutée n’est publiée pour les autres visiteurs. Elle n’effectue aucune collecte automatique et ne prétend pas représenter l'ensemble des interventions. Corpus initial : 12 affirmations issues de déclarations datées des 19 et 20 novembre 2026. Analyses documentaires préliminaires réalisées le 22 novembre 2026 avec assistance IA, non relues par une rédaction indépendante. Ces données ne représentent pas l'ensemble des déclarations de ces responsables. Les conclusions sont susceptibles d'être corrigées.</div>`}
function claims(){const list=[...data.claims].filter(c=>(filterPerson==='all'||c.personId===filterPerson)&&(filterStatus==='all'||c.status===filterStatus)&&(!filterSearch||[c.claim,c.theme,c.context,person(c.personId).name].some(x=>x.toLowerCase().includes(filterSearch.toLowerCase())))).sort((a,b)=>b.date.localeCompare(a.date));return header('Base documentaire','Affirmations','Filtrez les déclarations par responsable et état de vérification. Chaque fiche renvoie à sa source d’origine.')+`<div class="filters"><input id="searchClaims" class="control search" placeholder="Rechercher une affirmation…" value="${h(filterSearch)}" aria-label="Rechercher"><select class="control" id="filterPerson"><option value="all">Tous les responsables</option>${PEOPLE.map(p=>`<option value="${p.id}" ${filterPerson===p.id?'selected':''}>${h(p.name)}</option>`).join('')}</select><select class="control" id="filterStatus"><option value="all">Tous les états</option>${Object.entries(STATUSES).map(([id,s])=>`<option value="${id}" ${filterStatus===id?'selected':''}>${h(s.label)}</option>`).join('')}</select></div><div class="section-sub" style="margin-bottom:13px">${list.length} affirmation(s) trouvée(s)</div><div class="claim-list" id="claimsItems">${list.length?list.map(claimCard).join(''):emptyClaims()}</div>`}
function people(){return header('Périmètre initial','Responsables politiques','Le registre débute avec les trois fonctions demandées. Les candidats à la présidentielle pourront ensuite être ajoutés avec une liste datée et vérifiée.')+peopleCards()+`<div class="notice" style="margin-top:22px">Ne pas comparer les responsables à partir d’une note globale tant que les corpus n’ont pas la même couverture et la même méthode de sélection. Une absence de vérification ne constitue pas une affirmation confirmée.</div>`}
function methods(){const items=[['Sélection des déclarations','Recenser les interventions de manière documentée, sans sélectionner uniquement les phrases spectaculaires. Conserver les dates, les liens et le contexte.'],['Délimitation de l’affirmation','Distinguer les faits contrôlables des opinions, intentions, promesses et prédictions. Isoler une proposition à la fois sans déformer le sens.'],['Recherche contradictoire','Recouper les données auprès de sources datées, officielles et indépendantes. Examiner la définition des indicateurs, leur période et le champ couvert.'],['Décision justifiée','Classer comme confirmé, à nuancer, contredit ou indéterminé. Toute conclusion exige au minimum une source probante complémentaire et une explication.'],['Droit de réponse et corrections','Conserver les changements de statut, le motif et la date. Prévoir un droit de réponse avant publication publique pour les cas sensibles.'],['Transparence des mesures','Afficher le nombre de déclarations recensées, le volume réellement contrôlé et la distribution des conclusions. Éviter les classements simplificateurs.']];return header('Référentiel éditorial','Une méthode explicite','Le verdict ne dépend ni de la personne ni de son orientation politique, mais de la force des preuves disponibles.')+`<div class="methods">${items.map((m,i)=>`<section class="method"><div class="method-no">PRINCIPE ${String(i+1).padStart(2,'0')}</div><h3>${h(m[0])}</h3><p>${h(m[1])}</p></section>`).join('')}</div><div class="section-head"><div class="section-title">Références méthodologiques</div></div><div class="panel"><p><a target="_blank" rel="noopener" href="https://efcsn.com/code-of-standards/">EFCSN · Code de déontologie européen ↗</a></p><p><a target="_blank" rel="noopener" href="https://fullfact.org/about/how-we-fact-check/">Full Fact · Méthode de vérification ↗</a></p><p><a target="_blank" rel="noopener" href="https://schema.org/ClaimReview">Schema.org · Format ClaimReview ↗</a></p><p><a target="_blank" rel="noopener" href="https://data.assemblee-nationale.fr/travaux-parlementaires/debats">Assemblée nationale · Données des débats ↗</a></p></div>`}
function newClaim(){return header('Édition du corpus','Ajouter une affirmation','Une affirmation précise, un responsable identifié et un lien vers la déclaration originale.')+`<div class="form-wrap"><form id="newForm"><div class="form-grid"><div class="field"><label for="inPerson">Responsable *</label><select class="control" id="inPerson" required>${PEOPLE.map(p=>`<option value="${p.id}">${h(p.name)}</option>`).join('')}</select></div><div class="field"><label for="inDate">Date de la déclaration *</label><input class="control" type="date" id="inDate" required max="2099-12-31"></div><div class="field span2"><label for="inClaim">Affirmation reformulée de façon fidèle *</label><textarea id="inClaim" class="control" required minlength="12" maxlength="2000" placeholder="Une seule proposition factuelle, sans interprétation…"></textarea></div><div class="field span2"><label for="inQuote">Extrait exact (facultatif)</label><textarea id="inQuote" class="control" maxlength="4000" placeholder="Citation exacte si accessible, avec son contexte…"></textarea></div><div class="field"><label for="inTheme">Thématique *</label><select id="inTheme" class="control"><option>Économie</option><option>Emploi</option><option>Sécurité</option><option>Immigration</option><option>Santé</option><option>Logement</option><option>Éducation</option><option>Environnement</option><option>Diplomatie</option><option>Autre</option></select></div><div class="field"><label for="inContext">Contexte *</label><input class="control" id="inContext" required maxlength="200" placeholder="Entretien, conférence, discours…"></div><div class="field span2"><label for="inSource">URL de la source originale *</label><input class="control" id="inSource" required type="url" placeholder="https://…"><div class="hint">Lien vers un discours, une transcription ou une publication d’origine.</div></div></div><div class="form-foot"><p>L’entrée sera enregistrée « À vérifier ». Une conclusion nécessite une recherche complémentaire.</p><button class="btn btn-primary" type="submit">Enregistrer l’affirmation →</button></div></form></div><div class="section-head"><div class="section-title">Gestion des données locales</div></div><div class="action-row"><button class="btn btn-sm" id="exportBtn">Exporter JSON</button><button class="btn btn-sm" id="importBtn">Importer JSON</button><button class="btn btn-sm" id="resetBtn">Réinitialiser</button></div><p class="footnote">Les saisies sont conservées dans ce navigateur seulement. Aucun serveur, aucune publication publique, aucune API d’intelligence artificielle. L’export permet de sauvegarder vos données.</p>`}
function render(){renderNav();const node=document.getElementById('content');node.innerHTML=({overview,claims,people,method:methods,new:newClaim})[view]();if(view==='claims'){document.getElementById('filterPerson').value=filterPerson;document.getElementById('filterStatus').value=filterStatus}}
function showToast(t){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${h(t)}</div>`;setTimeout(()=>{r.innerHTML=''},3500)}
function detail(id){const c=data.claims.find(x=>x.id===id);if(!c)return;let p=person(c.personId);let history=(c.history||[]).map(x=>`<div class="source-item" style="margin-bottom:7px">${dateFr(x.at.slice(0,10))} · ${h(x.action)}</div>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="modal" id="modal"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Détail de l'affirmation"><div class="modal-top"><div class="eyebrow">Affirmation ${h(c.id)}</div><button class="modal-close" data-close aria-label="Fermer">×</button></div><h2 class="modal-title">${h(c.claim)}</h2><div class="detail-meta">${h(p.name)} · ${dateFr(c.date)} · ${h(c.theme)}</div><div class="claim-foot" style="margin-bottom:17px">${statusChip(c.status)}</div><div class="detail-block"><b>Contexte</b><p>${h(c.context||'Non renseigné')}</p></div>${c.rawQuote?`<div class="detail-block"><b>Extrait de la déclaration</b><p>${h(c.rawQuote)}</p></div>`:''}<div class="detail-block"><b>Source originale</b><p class="sources-list"><a target="_blank" rel="noopener noreferrer" class="source-item" href="${h(safeUrl(c.source))}">${h(c.source)}</a></p></div><div class="detail-block"><b>Justification de la conclusion</b><p>${h(c.explanation||'Aucune vérification indépendante publiée pour le moment.')}</p></div><div class="detail-block"><b>Sources documentaires complémentaires</b><p class="sources-list">${(Array.isArray(c.evidenceLinks)&&c.evidenceLinks.length?c.evidenceLinks:c.evidence?[c.evidence]:[]).map(url=>`<a target="_blank" rel="noopener noreferrer" class="source-item" href="${h(safeUrl(url))}">${h(url)}</a>`).join('')||'Non renseignée'}</p></div><div class="detail-block"><b>Historique</b>${history||'<p>Historique vide.</p>'}</div><div class="action-row" style="margin-top:20px"><button class="btn btn-primary" id="reviewBtn" data-id="${h(c.id)}">Documenter la vérification</button><button class="btn" data-close>Fermer</button></div></div></div>`}
function review(id){const c=data.claims.find(x=>x.id===id);if(!c)return;document.getElementById('modalRoot').innerHTML=`<div class="modal" id="modal"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Documenter une vérification"><div class="modal-top"><div class="eyebrow">Édition · ${h(person(c.personId).name)}</div><button class="modal-close" data-close aria-label="Fermer">×</button></div><h2 class="modal-title">Documenter une vérification</h2><p class="subtle">${h(c.claim)}</p><div class="notice">Aucune conclusion n’est générée automatiquement. La conclusion publique nécessite une vérification humaine indépendante. Toute édition ici reste locale à votre navigateur.</div><form id="reviewForm" data-id="${h(id)}"><div class="field"><label for="revStatus">État de vérification *</label><select class="control" id="revStatus">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${k===c.status?'selected':''}>${h(v.label)}</option>`).join('')}</select></div><div class="field"><label for="revEvidence">Source contradictoire ou probante *</label><input class="control" id="revEvidence" type="url" value="${h(c.evidence||'')}" placeholder="https://…"><span class="hint">Obligatoire pour publier une conclusion autre que « À vérifier ».</span></div><div class="field"><label for="revExplanation">Méthode, résultats et limites *</label><textarea class="control" id="revExplanation" rows="5" placeholder="Données utilisées, dates, champ, limites, contradiction éventuelle…">${h(c.explanation||'')}</textarea></div><div class="field"><label for="revReviewer">Auteur de la vérification</label><input class="control" id="revReviewer" maxlength="100" value="${h(c.reviewer||'')}" placeholder="Nom ou identifiant éditorial"></div><div class="form-foot"><p>Le registre conserve une trace datée de toute modification.</p><button class="btn btn-primary" type="submit">Enregistrer la décision →</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){let v=JSON.stringify({exportedAt:new Date().toISOString(),version:1,people:PEOPLE,claims:data.claims},null,2);let u=URL.createObjectURL(new Blob([v],{type:'application/json;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='paroles-preuves-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);showToast('Données exportées en JSON.')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav]');if(t){navTo(t.dataset.nav);return}let x=e.target.closest('[data-person]');if(x){filterPerson=x.dataset.person;filterStatus='all';filterSearch='';navTo('claims');return}let c=e.target.closest('[data-open]');if(c){detail(c.dataset.open);return}if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return}let r=e.target.closest('#reviewBtn');if(r){review(r.dataset.id);return}if(e.target.closest('#exportTop,#exportBtn')){exportData();return}if(e.target.closest('#addTop')){navTo('new');return}if(e.target.closest('#importBtn')){document.getElementById('importFile').click();return}if(e.target.closest('#resetBtn')){if(confirm('Réinitialiser le registre ? Toutes vos saisies locales seront remplacées par les données initiales.')){data={version:1,claims:structuredClone(SEED)};persist();render();showToast('Registre réinitialisé.')}return}});
document.addEventListener('change',e=>{if(e.target.id==='filterPerson'){filterPerson=e.target.value;render()}if(e.target.id==='filterStatus'){filterStatus=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='searchClaims'){filterSearch=e.target.value;const focus=e.target.selectionStart;render();let inp=document.getElementById('searchClaims');inp.focus();inp.setSelectionRange(focus,focus)}});
document.addEventListener('submit',e=>{if(e.target.id==='newForm'){e.preventDefault();const $=x=>document.getElementById(x).value.trim();const source=safeUrl($('inSource'));if(!source){alert('URL de source invalide.');return}const now=new Date().toISOString();const c={id:'aff-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),personId:$('inPerson'),date:$('inDate'),claim:$('inClaim'),rawQuote:$('inQuote'),theme:$('inTheme'),context:$('inContext'),source,status:'attente',explanation:'',evidence:'',reviewer:'',reviewedAt:null,createdAt:now,history:[{at:now,action:'Affirmation enregistrée. Vérification en attente.'}]};data.claims.unshift(c);persist();filterPerson='all';filterStatus='all';filterSearch='';navTo('claims');showToast('Affirmation enregistrée, sans verdict.')}if(e.target.id==='reviewForm'){e.preventDefault();const id=e.target.dataset.id;let c=data.claims.find(x=>x.id===id);if(!c)return;let s=document.getElementById('revStatus').value;let src=document.getElementById('revEvidence').value.trim();let explanation=document.getElementById('revExplanation').value.trim();if(s!=='attente'&&(!safeUrl(src)||explanation.length<35)){alert('Pour publier une conclusion, renseignez une source probante valide et une justification précise (35 caractères minimum).');return}const now=new Date().toISOString();c.status=s;c.evidence=safeUrl(src);c.explanation=explanation;c.reviewer=document.getElementById('revReviewer').value.trim();c.reviewedAt=s==='attente'?null:now;c.history=c.history||[];c.history.push({at:now,action:'État modifié : '+STATUSES[s].label+' ; auteur : '+(c.reviewer||'non renseigné')});persist();closeModal();render();detail(id);showToast('Vérification enregistrée dans ce navigateur.')}});
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.claims)||o.claims.length>10000||!o.claims.every(x=>x&&typeof x.claim==='string'&&typeof x.source==='string'&&typeof x.id==='string'&&PEOPLE.some(p=>p.id===x.personId)&&STATUSES[x.status]&&safeUrl(x.source)))throw Error('Format invalide');if(confirm('Importer '+o.claims.length+' affirmation(s) et remplacer le corpus local ?')){data={version:1,claims:o.claims};persist();render();showToast('Import JSON terminé.')}}catch(err){alert('Impossible d’importer ce fichier JSON : '+err.message)}e.target.value='' });
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script></body></html>
